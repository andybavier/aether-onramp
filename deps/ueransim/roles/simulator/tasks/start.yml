---

- name: check if servers and config server length are equal
  fail:
    msg: "Number of ueransim nodes and servers in config file are not equal"
  when: ueransim.servers|length != groups['ueransim_nodes']|length

- name: create UERANSIM config directory
  file:
    path: /tmp/ueransim
    state: directory
    mode: '0755'
  when: inventory_hostname in groups['ueransim_nodes']
  become: true

- name: copy gNb config files to ueransim host
  template:
    src: "{{ ROOT_DIR }}/{{ ueransim.servers[server_index | int].gnb }}"
    dest: /tmp/ueransim/custom-gnb.yaml
  vars:
    server_index: "{{ groups['ueransim_nodes'].index(inventory_hostname) }}"
  when: inventory_hostname in groups['ueransim_nodes']
  become: true

- name: copy UE config files to ueransim host
  template:
    src: "{{ ROOT_DIR }}/{{ ueransim.servers[server_index | int].ue }}"
    dest: /tmp/ueransim/custom-ue.yaml
  vars:
    server_index: "{{ groups['ueransim_nodes'].index(inventory_hostname) }}"
  when: inventory_hostname in groups['ueransim_nodes']
  become: true

- name: remove existing UERANSIM container
  community.docker.docker_container:
    name: "{{ ueransim.docker.container.name }}"
    state: absent
  when: inventory_hostname in groups['ueransim_nodes']
  become: true

- name: create UERANSIM container
  community.docker.docker_container:
    name: "{{ ueransim.docker.container.name }}"
    image: "{{ ueransim.docker.container.image }}"
    network_mode: "{{ ueransim.docker.network.name }}"
    volumes:
      - /tmp/ueransim:/opt/ueransim/config
    privileged: true
    state: started
    detach: true
    command: sleep infinity
  when: inventory_hostname in groups['ueransim_nodes']
  become: true

- name: Run gNB
  community.docker.docker_container_exec:
    container: "{{ ueransim.docker.container.name }}"
    detach: true
    argv:
      - /bin/bash
      - -lc
      - >-
        echo "Starting nr-gnb at $(date -Is)" >> /opt/ueransim/config/nr-gnb.log;
        exec nr-gnb -c /opt/ueransim/config/custom-gnb.yaml
        >> /opt/ueransim/config/nr-gnb.log 2>&1
  register: gnb_exec
  when: "inventory_hostname in groups['ueransim_nodes']"
  become: true

- debug:
    var: gnb_exec.exec_id
  when: "inventory_hostname in groups['ueransim_nodes']"

- pause:
    seconds: 5

- name: Run UE
  community.docker.docker_container_exec:
    container: "{{ ueransim.docker.container.name }}"
    detach: true
    argv:
      - /bin/bash
      - -lc
      - >-
        echo "Starting nr-ue at $(date -Is)" >> /opt/ueransim/config/nr-ue.log;
        exec nr-ue -c /opt/ueransim/config/custom-ue.yaml
        >> /opt/ueransim/config/nr-ue.log 2>&1
  register: ue_exec
  when: "inventory_hostname in groups['ueransim_nodes']"
  become: true

- debug:
    var: ue_exec.exec_id
  when: "inventory_hostname in groups['ueransim_nodes']"

- pause:
    seconds: 5

- name: Get UE IP address
  block:
    - name: Get UE IP address
      command:
        argv:
          - ip
          - -o
          - -4
          - addr
          - show
          - uesimtun0
      register: ue_ip_result
      retries: 5
      delay: 2
      until:
        - ue_ip_result.rc == 0
        - (ue_ip_result.stdout | trim) != ''
      changed_when: false
  rescue:
    - name: collect UERANSIM process diagnostics
      community.docker.docker_container_exec:
        container: "{{ ueransim.docker.container.name }}"
        argv:
          - /bin/bash
          - -lc
          - >-
            echo "=== ps ===";
            ps -ef;
            echo "=== ip addr ===";
            ip addr;
            echo "=== nr-gnb.log ===";
            cat /opt/ueransim/config/nr-gnb.log 2>/dev/null || true;
            echo "=== nr-ue.log ===";
            cat /opt/ueransim/config/nr-ue.log 2>/dev/null || true
      register: ueransim_diagnostics
      failed_when: false
      changed_when: false
      become: true

    - debug:
        var: ueransim_diagnostics.stdout_lines

    - fail:
        msg: "UERANSIM did not create uesimtun0. See UERANSIM diagnostics above and CI artifacts."
  when: "inventory_hostname in groups['ueransim_nodes']"

- set_fact:
    ue_ip: "{{ ue_ip_result.stdout | regex_replace('^.* inet ([^/ ]+).*$','\\1') }}"
  when: "inventory_hostname in groups['ueransim_nodes']"

- debug:
    var: ue_ip
  when: inventory_hostname in groups['ueransim_nodes']

- set_fact:
    ping_target: "{{ core.upf.core_subnet | regex_replace('(/.*$)', '') }}"
  when: "inventory_hostname in groups['ueransim_nodes']"

- name: Run ping command for connectivity
  community.docker.docker_container_exec:
    container: "{{ ueransim.docker.container.name }}"
    argv:
      - nr-binder
      - "{{ ue_ip }}"
      - ping
      - -c
      - '5'
      - "{{ ping_target }}"
  register: ue_output
  when: "inventory_hostname in groups['ueransim_nodes']"
  become: true

- debug:
    var: ue_output.stdout_lines
  when: "inventory_hostname in groups['ueransim_nodes']"
